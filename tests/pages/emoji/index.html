<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
html, body { margin: 0; background: #2b3a46; color: #eee; font: 24px/1.5 ui-monospace, monospace; }
canvas { position: fixed; inset: 0; width: 100%; height: 100%; }
main { position: fixed; inset: 0; padding: 40px; }
.round { width: 64px; height: 64px; border-radius: 50%; border: 0; background: #2c3c48; color: #fff; font-size: 28px; margin-right: 12px; }
.big { font-size: 48px; }
p { margin: 16px 0; }
</style>
</head>
<body>
<canvas></canvas>
<main>
  <div><button class="round">⌂</button><button class="round">🔊</button><button class="round">💡</button></div>
  <p>🎓 Learn chess — ♛ ♜ ♝ ♞ ♟ ⌂ ↶ ‹ ›</p>
  <p class="big">😀 🚀 ❤️ 👍🏽 ✅ ⭐ 👨‍👩‍👧</p>
  <p>Mixed: move ♞ to f3 💡 then castle 🏰</p>
</main>
</body>
</html>
